services:
  fridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/fridge.db
    volumes:
      - ./data:/app/data

  # Reverse proxy with automatic HTTPS (Let's Encrypt) for $DOMAIN.
  # Remove this service if the server already runs nginx/Traefik/Caddy on ports 80/443.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fridge

volumes:
  caddy_data:
  caddy_config:
