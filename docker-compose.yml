services:
  fridge:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/fridge.db
    volumes:
      - ./data:/app/data
    # Only reachable from the server itself: put a reverse proxy (Caddy, nginx...) in front.
    ports:
      - "127.0.0.1:8080:8080"

  # Optional bundled reverse proxy with automatic HTTPS for $DOMAIN, for servers that don't
  # already run one on ports 80/443. Enable with: docker compose --profile caddy up -d
  caddy:
    image: caddy:2.8
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - fridge

volumes:
  caddy_data:
  caddy_config:
