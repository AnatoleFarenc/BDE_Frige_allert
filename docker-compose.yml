services:
  frigo:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/frigo.db
    volumes:
      - ./data:/app/data

  # Reverse proxy with automatic HTTPS (Let's Encrypt) for frigo.bde42perpignan.fr.
  # Remove this service if the server already runs nginx/Traefik/Caddy on ports 80/443.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frigo

volumes:
  caddy_data:
  caddy_config:
